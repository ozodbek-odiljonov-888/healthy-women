name: Browser E2E Healthy Women (fictional data)
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/e2e-browser.mjs'
      - 'scripts/**'
      - '.github/workflows/browser-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/e2e-browser.mjs'
      - 'scripts/**'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate offline assets before browser testing
        run: npm run test:site
      - name: Test diary, encryption, backup and restore in Chromium
        run: node tests/e2e-browser.mjs
