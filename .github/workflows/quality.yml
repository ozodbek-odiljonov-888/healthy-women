name: Verify Healthy Women preview
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - 'worker/**'
      - 'bot-vercel/**'
      - 'db/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/android-signed.yml'
      - '.github/workflows/android-release.yml'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [main, feature/v1-8-telegram-auth-foundation, feature/v1-9-encrypted-sync-contract, feature/v1-10-neon-atomic-storage, feature/v1-11-staging-sync-api, feature/v1-12-free-quota-guards, feature/v1-13-free-medical-qa]
    paths:
      - 'site/**'
      - 'tests/**'
      - 'worker/**'
      - 'bot-vercel/**'
      - 'db/**'
      - 'scripts/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: Healthy-Women-PWA-preview
          path: site/
          if-no-files-found: error
