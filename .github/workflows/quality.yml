name: Verify Healthy Women preview
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - 'worker/**'
      - 'bot-vercel/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test worker/index.test.js tests/checkins.test.mjs tests/site.test.mjs tests/vault.test.mjs tests/deployment.test.mjs tests/bot-vercel.test.mjs tests/cycle-safety.test.mjs tests/insights.test.mjs tests/reminders.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Healthy-Women-PWA-preview
          path: site/
          if-no-files-found: error
