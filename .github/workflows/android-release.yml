name: Build Healthy Women signed Android release
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Incrementing Android versionCode
        required: true
        default: '100'
        type: string
      version_name:
        description: VersionName such as 1.0.0
        required: true
        default: '1.0.0'
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate signing secrets
        env:
          STORE_B64: ${{ secrets.HEALTHY_WOMEN_ANDROID_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.HEALTHY_WOMEN_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HEALTHY_WOMEN_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.HEALTHY_WOMEN_ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          test -n "$STORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo "::error::Configure signing secrets first. See ANDROID_RELEASE.md."; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+(\.[0-9]+){0,2}$ ]] || exit 1
      - name: Create native Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          node scripts/harden-android.mjs
      - name: Configure private signing without logging secrets
        env:
          STORE_B64: ${{ secrets.HEALTHY_WOMEN_ANDROID_KEYSTORE_B64 }}
          HW_STORE_PASS: ${{ secrets.HEALTHY_WOMEN_ANDROID_STORE_PASSWORD }}
          HW_KEY_ALIAS: ${{ secrets.HEALTHY_WOMEN_ANDROID_KEY_ALIAS }}
          HW_KEY_PASS: ${{ secrets.HEALTHY_WOMEN_ANDROID_KEY_PASSWORD }}
          HW_VERSION_CODE: ${{ inputs.version_code }}
          HW_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          umask 077
          printf '%s' "$STORE_B64" | base64 --decode > android/app/healthy-women-release.jks
          test -s android/app/healthy-women-release.jks
          cat >> android/app/build.gradle <<'GROOVY'
          android {
            defaultConfig {
              versionCode Integer.parseInt(System.getenv("HW_VERSION_CODE"))
              versionName System.getenv("HW_VERSION_NAME")
            }
            signingConfigs {
              healthyWomenRelease {
                storeFile file("healthy-women-release.jks")
                storePassword System.getenv("HW_STORE_PASS")
                keyAlias System.getenv("HW_KEY_ALIAS")
                keyPassword System.getenv("HW_KEY_PASS")
                enableV1Signing true
                enableV2Signing true
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.healthyWomenRelease
              }
            }
          }
          GROOVY
      - name: Build signed APK
        working-directory: android
        env:
          HW_STORE_PASS: ${{ secrets.HEALTHY_WOMEN_ANDROID_STORE_PASSWORD }}
          HW_KEY_ALIAS: ${{ secrets.HEALTHY_WOMEN_ANDROID_KEY_ALIAS }}
          HW_KEY_PASS: ${{ secrets.HEALTHY_WOMEN_ANDROID_KEY_PASSWORD }}
          HW_VERSION_CODE: ${{ inputs.version_code }}
          HW_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Verify APK and write checksum
        working-directory: android
        run: |
          tools_version="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$tools_version/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
      - name: Attach signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Healthy-Women-SIGNED-Android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
