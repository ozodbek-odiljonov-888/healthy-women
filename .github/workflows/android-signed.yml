name: Build Healthy Women signed test APK (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-test:
    name: Signed Android test build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: android-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate and harden Android app
        run: |
          npx cap add android
          npx cap sync android
          node scripts/harden-android.mjs
      - name: Decode protected test signing keystore
        env:
          HW_KEYSTORE_BASE64: ${{ secrets.HW_KEYSTORE_BASE64 }}
          HW_SIGNING_STORE_PASSWORD: ${{ secrets.HW_STORE_PASSWORD }}
          HW_SIGNING_KEY_ALIAS: ${{ secrets.HW_KEY_ALIAS }}
          HW_SIGNING_KEY_PASSWORD: ${{ secrets.HW_KEY_PASSWORD }}
        run: |
          test -n "$HW_KEYSTORE_BASE64" || { echo "Missing signing keystore secret"; exit 1; }
          test -n "$HW_SIGNING_STORE_PASSWORD" || exit 1
          test -n "$HW_SIGNING_KEY_ALIAS" || exit 1
          test -n "$HW_SIGNING_KEY_PASSWORD" || exit 1
          KEY_PATH="$RUNNER_TEMP/healthy-women-test-signing.jks"
          umask 077
          printf '%s' "$HW_KEYSTORE_BASE64" | base64 --decode > "$KEY_PATH"
          test -s "$KEY_PATH"
          echo "HW_SIGNING_STORE_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Configure signing without storing passwords
        env:
          HW_SIGNING_STORE_PASSWORD: ${{ secrets.HW_STORE_PASSWORD }}
          HW_SIGNING_KEY_ALIAS: ${{ secrets.HW_KEY_ALIAS }}
          HW_SIGNING_KEY_PASSWORD: ${{ secrets.HW_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.mjs
      - name: Build signed APK
        working-directory: android
        env:
          HW_SIGNING_STORE_PASSWORD: ${{ secrets.HW_STORE_PASSWORD }}
          HW_SIGNING_KEY_ALIAS: ${{ secrets.HW_KEY_ALIAS }}
          HW_SIGNING_KEY_PASSWORD: ${{ secrets.HW_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOLS_DIR/apksigner"
          "$TOOLS_DIR/apksigner" verify "android/app/build/outputs/apk/release/app-release.apk"
      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: Healthy-Women-Android-signed-test
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
      - name: Erase temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/healthy-women-test-signing.jks"
