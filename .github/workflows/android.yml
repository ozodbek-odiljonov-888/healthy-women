name: Build Healthy Women Android debug APK
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/harden-android.mjs'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/harden-android.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      # GitHub-hosted ubuntu runner includes the Android SDK. The setup-android
      # action currently fails when trying to install removed legacy 'tools'.
      - name: Verify installed Android SDK
        run: test -d "$ANDROID_HOME" && echo "Android SDK OK"
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create native Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Harden Android backup and screenshot privacy
        run: node scripts/harden-android.mjs
      - name: Build Android debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Healthy-Women-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
